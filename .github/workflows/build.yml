name: build-apk
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 准备源码
        run: |
          shopt -s nullglob
          for z in *.zip; do echo "解压 $z"; unzip -q -o "$z" -d .; done
          ls -la
          test -f cmcc_hook/settings.gradle

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 编译
        working-directory: cmcc_hook
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: 'cmcc_hook/app/build/outputs/apk/**/*.apk'
          if-no-files-found: error
